<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Homescreen</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffe6f2,#ffd6ec,#fff0f7);
font-family:'Special Elite',cursive;
overflow:hidden;
position:relative;
cursor:none;
}

/* cursor */
.cursor{
position:fixed;
width:18px;
height:18px;
border-radius:50%;
background:#ff4fa3;
pointer-events:none;
mix-blend-mode:screen;
box-shadow:0 0 15px #ff4fa3,0 0 30px #ff85c1;
z-index:99999;
}

/* epilepsy warning */
.epi-warning{
position:fixed;
inset:0;
background:radial-gradient(circle at center, rgba(0,0,0,0.85), rgba(0,0,0,0.97));
display:flex;
justify-content:center;
align-items:center;
z-index:10000;
}

.epi-box{
width:90%;
max-width:420px;
background:#1a0a12;
border:2px solid #ff4fa3;
border-radius:20px;
padding:30px;
text-align:center;
color:white;
box-shadow:0 0 30px rgba(255,79,163,.4);
}

.epi-box h2{
margin:0 0 15px;
color:#ff4fa3;
}

.epi-box button{
padding:12px 24px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#ff4fa3,#ff85c1);
color:white;
cursor:pointer;
}

/* MACBOOK (cartoon pink) */
.laptop{
display:flex;
flex-direction:column;
align-items:center;
}

/* frame */
.screen-frame{
width:920px;
height:560px;
background:linear-gradient(145deg,#ffc2dd,#ffd6ec);
border-radius:30px;
padding:20px;
box-shadow:
0 25px 60px rgba(255,105,180,.35),
inset 0 3px 6px rgba(255,255,255,.5);
position:relative;
}

/* notch */
.notch{
position:absolute;
top:6px;
left:50%;
transform:translateX(-50%);
width:110px;
height:16px;
background:#ff9ecf;
border-radius:0 0 12px 12px;
}

/* screen */
.screen{
width:100%;
height:100%;
background:#fff5fa;
border-radius:20px;
overflow:hidden;
display:flex;
flex-direction:column;
position:relative;
}

/* soft texture */
.screen::before{
content:"";
position:absolute;
inset:0;
background:repeating-linear-gradient(
0deg,
rgba(255,105,180,.03) 0px,
rgba(255,105,180,.03) 1px,
transparent 1px,
transparent 3px
);
pointer-events:none;
}

/* topbar */
.topbar{
background:#ff9ecf;
padding:12px 20px;
display:flex;
justify-content:space-between;
color:white;
font-size:14px;
}

/* desktop */
.desktop{
flex:1;
display:flex;
justify-content:center;
align-items:center;
gap:60px;
flex-wrap:wrap;
}

/* icons */
.icon{
display:flex;
flex-direction:column;
align-items:center;
cursor:pointer;
transition:.3s;
}

.icon img{
width:65px;
filter:drop-shadow(0 6px 10px rgba(255,105,180,.3));
}

.icon:hover{
transform:translateY(-6px) scale(1.05);
}

.icon span{
margin-top:10px;
font-size:13px;
color:#ff4fa3;
}

/* removed dock completely */
.note{
position:absolute;
bottom:20px;
right:30px;
color:#ff4fa3;
font-size:12px;
}

/* popup */
.popup{
position:absolute;
top:100px;
left:100px;
width:250px;
background:white;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
padding:15px;
display:none;
}

/* virus */
.virus-screen{
position:fixed;
inset:0;
background:black;
color:#00ff88;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
opacity:0;
pointer-events:none;
}

.fadeIn{
opacity:1;
pointer-events:auto;
}

.typing{
border-right:2px solid #00ff88;
white-space:nowrap;
overflow:hidden;
animation:typing 3s steps(30,end), blink .8s infinite;
}

@keyframes typing{
from{width:0;}
to{width:260px;}
}

@keyframes blink{
50%{border-color:transparent;}
}

/* base */
.base{
width:960px;
height:20px;
background:linear-gradient(to bottom,#ffc2dd,#ff9ecf);
border-radius:0 0 40px 40px;
box-shadow:0 10px 25px rgba(255,105,180,.4);
margin-top:-8px;
}

</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<div class="epi-warning" id="epiWarning">
<div class="epi-box">
<h2>⚠ Epilepsy Warning</h2>
<p>Flashing lights ahead.</p>
<button onclick="dismissWarning()">Enter</button>
</div>
</div>

<div class="laptop">

<div class="screen-frame">
<div class="notch"></div>

<div class="screen">

<div class="topbar">
<span>♡ angel’s macbook ♡</span>
<span id="clock"></span>
</div>

<div class="desktop">
<div class="icon" onclick="downloadVirus()">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
<span>download_cutie_app.exe</span>
</div>

<div class="icon" onclick="openPopup()">
<img src="https://cdn-icons-png.flaticon.com/512/888/888879.png">
<span>diary.txt</span>
</div>

<div class="icon">
<img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">
<span>love_photos.zip</span>
</div>
</div>

<div class="note">new aesthetic diary app just dropped!</div>

<div class="popup" id="popup">
<p>dear diary… something feels off tonight.</p>
</div>

</div>
</div>

<div class="base"></div>

</div>

<div class="virus-screen" id="virus">
<div class="typing">System Breach Detected...</div>
<div>FracturedNight.exe Activated</div>
</div>

<script>

/* cursor */
document.addEventListener("mousemove",e=>{
const c=document.getElementById("cursor");
c.style.left=e.clientX+"px";
c.style.top=e.clientY+"px";
});

/* clock */
setInterval(()=>{
const d=new Date();
document.getElementById("clock").textContent=d.toLocaleTimeString();
},1000);

function dismissWarning(){
document.getElementById('epiWarning').style.display='none';
}

function openPopup(){
document.getElementById("popup").style.display="block";
}

function downloadVirus(){
const v=document.getElementById("virus");
v.classList.add("fadeIn");
setTimeout(()=>{window.location.href="public/signupform.html";},4000);
}

</script>

</body>
</html>
